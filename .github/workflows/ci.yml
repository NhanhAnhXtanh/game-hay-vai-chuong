name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: dummy
          VITE_FIREBASE_AUTH_DOMAIN: dummy
          VITE_FIREBASE_DATABASE_URL: https://dummy.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: dummy
          VITE_FIREBASE_APP_ID: dummy
          VITE_CHESS_FIREBASE_API_KEY: dummy
          VITE_CHESS_FIREBASE_AUTH_DOMAIN: dummy
          VITE_CHESS_FIREBASE_DATABASE_URL: https://dummy.firebaseio.com
          VITE_CHESS_FIREBASE_PROJECT_ID: dummy
          VITE_CHESS_FIREBASE_APP_ID: dummy
        run: npm run build
